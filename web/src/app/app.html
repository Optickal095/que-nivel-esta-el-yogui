<main>
  @if (facade.overview(); as character) {
    <app-hero
      [character]="character"
      [lastLogin]="lastLogin()!"
      [levelSince]="levelSince()"
      [deathsAtLevel]="deathsAtLevel()"
    />

    <div class="grid">
      <app-equipment class="span-2" [items]="character.equipment" />
      @if (character.hunterPets.length > 0) {
        <app-hunter-pets class="span-2" [pets]="character.hunterPets" />
      }
      <app-stats [stats]="character.stats" />
      <app-progress [professions]="character.professions" [reputations]="character.reputations" />
      <app-fun-stats class="span-2" [stats]="character.funStats" />
      <app-level-history class="span-2" [events]="facade.history()" [now]="facade.now()" />
      <app-comments
        class="span-2"
        [comments]="comments.comments()"
        [now]="facade.now()"
        [posting]="comments.posting()"
        [error]="comments.error()"
        [moderating]="comments.moderating()"
        [showModeration]="moderationRequested || comments.moderating()"
        [posted]="comments.posted()"
        (send)="comments.post($event)"
        (remove)="comments.remove($event)"
        (unlock)="comments.unlock($event)"
        (lock)="comments.lock()"
      />
    </div>

    <footer>
      Datos de la API de Blizzard (WoW Forever), actualizados {{ updatedAgo() }}. Se refrescan solos cada
      minuto.
    </footer>
  } @else if (facade.error(); as error) {
    <p class="state">{{ error }}</p>
  } @else {
    <p class="state">Buscando al Yogui…</p>
  }
</main>
